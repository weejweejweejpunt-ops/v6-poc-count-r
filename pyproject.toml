[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-poc-count-r"
version = "0.1.0"
description = "vantage6 v5 proof of concept: federated count of rows per value of a column (default: gender), counted in R"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pandas",
  "vantage6-algorithm-tools>=5.0.3,<5.1",
]
authors = [
  { name = "Wijnand Laan" },
]
keywords = ["vantage6", "algorithm", "federated-learning", "omop", "r"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: R",
]

[project.urls]
Repository = "https://github.com/weejweejweejpunt-ops/v6-poc-count-r"

[tool.hatch.build.targets.wheel]
packages = ["v6_poc_count_r"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
